<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <!-- subtle top highlight -->
  <rect x="6" y="6" width="116" height="40" rx="26" fill="#ffffff" opacity="0.10"/>

  <!-- Server chassis -->
  <rect x="34" y="24" width="60" height="80" rx="12" fill="#ffffff"/>

  <!-- Server slot lines -->
  <rect x="46" y="38" width="36" height="6" rx="3" fill="#1e3a8a" opacity="0.18"/>
  <rect x="46" y="50" width="36" height="6" rx="3" fill="#1e3a8a" opacity="0.18"/>
  <rect x="46" y="62" width="36" height="6" rx="3" fill="#1e3a8a" opacity="0.18"/>

  <!-- Power / status glyph -->
  <g stroke="#16a34a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ring: 90° gap at top; butt caps keep the gap visible -->
    <path d="M 54.10 80.10 A 14 14 0 1 1 73.90 80.10" stroke-linecap="butt"/>
    <line x1="64" y1="76" x2="64" y2="90"/>
  </g>
</svg>
